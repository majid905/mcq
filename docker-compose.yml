# Local development services. Values come from .env (see .env.example); defaults match it.
#   docker compose up -d                  mysql, redis, meilisearch
#   docker compose --profile mock up -d   + Prism mock on :4010 (or run `pnpm mock` on the host)
name: mcq

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mcq}
      MYSQL_USER: ${MYSQL_USER:-mcq}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      TZ: UTC
    # docs/03-DATABASE.md section 5, scaled down for a laptop.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --innodb-buffer-pool-size=512M
      - --innodb-redo-log-capacity=512M
      - --innodb-flush-log-at-trx-commit=1
      - --max-connections=200
      - --slow-query-log=ON
      - --long-query-time=0.5
      - --binlog-expire-logs-seconds=604800
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    ports:
      - '7700:7700'
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-change-me-meili}
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:7700/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  # Prism mock of packages/api-contract/openapi.yaml at http://localhost:4010/v1.
  # Off by default so it does not clash with `pnpm mock`; enable with `--profile mock`.
  mock:
    profiles: ['mock']
    image: node:22-alpine
    working_dir: /app/packages/api-contract
    volumes:
      - ./:/app:ro
    ports:
      - '4010:4010'
    command: sh -c "npm install -g @stoplight/prism-cli@5.16.0 && node scripts/mock.mjs"

volumes:
  mysql-data:
  redis-data:
  meili-data:
