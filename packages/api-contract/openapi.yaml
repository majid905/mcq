                    - { key: a, html: অনুচ্ছেদ ২ }
                    - { key: b, html: অনুচ্ছেদ ২ক }
                    - { key: c, html: অনুচ্ছেদ ৩ }
                    - { key: d, html: অনুচ্ছেদ ৪ক }
                  correct_option: b
                  explanation: '<p>সংবিধানের ২ক অনুচ্ছেদে বলা হয়েছে, প্রজাতন্ত্রের রাষ্ট্রধর্ম ইসলাম, তবে অন্যান্য ধর্ম পালনে রাষ্ট্র সমমর্যাদা ও সমঅধিকার নিশ্চিত করবে।</p>'
                  answer_locked: false
                  difficulty: 2
                  source_label: ৪৫তম বিসিএস
                  topic:
                    id: '1203'
                    parent_id: '120'
                    type: topic
                    name_bn: সংবিধান
                    name_en: Constitution
                    slug: constitution
                    icon: null
                    question_count: 640
                    has_children: false
                    progress: null
                  is_bookmarked: true
                  stats: { correct_pct: 61.5 }
        '404': { $ref: '#/components/responses/Error' }

  /public/questions/{slug}:
    get:
      tags: [Questions]
      security: []
      summary: Public SEO question page data (FR-WEB-02)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Question' }
              example:
                data:
                  id: '30001'
                  body: '<p>বাংলাদেশের সংবিধানের কোন অনুচ্ছেদে "রাষ্ট্রধর্ম" সম্পর্কে বলা হয়েছে?</p>'
                  options:
                    - { key: a, html: অনুচ্ছেদ ২ }
                    - { key: b, html: অনুচ্ছেদ ২ক }
                    - { key: c, html: অনুচ্ছেদ ৩ }
                    - { key: d, html: অনুচ্ছেদ ৪ক }
                  correct_option: b
                  explanation: '<p>সংবিধানের ২ক অনুচ্ছেদে বলা হয়েছে, প্রজাতন্ত্রের রাষ্ট্রধর্ম ইসলাম, তবে অন্যান্য ধর্ম পালনে রাষ্ট্র সমমর্যাদা ও সমঅধিকার নিশ্চিত করবে।</p>'
                  answer_locked: false
                  difficulty: 2
                  source_label: ৪৫তম বিসিএস
                  topic:
                    id: '1203'
                    parent_id: '120'
                    type: topic
                    name_bn: সংবিধান
                    name_en: Constitution
                    slug: constitution
                    icon: null
                    question_count: 640
                    has_children: false
                    progress: null
                  is_bookmarked: true
                  stats: { correct_pct: 61.5 }

  /questions/{id}/reports:
    post:
      tags: [Questions]
      summary: Report a question (FR-REP-01)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [wrong_answer, typo, wrong_explanation, duplicate, other] }
                message: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Reported }
        '409': { $ref: '#/components/responses/Error' }

  /bookmarks:
    get:
      tags: [Questions]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Question' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
              example:
                data:
                  - id: '30001'
                    body: '<p>বাংলাদেশের সংবিধানের কোন অনুচ্ছেদে "রাষ্ট্রধর্ম" সম্পর্কে বলা হয়েছে?</p>'
                    options:
                      - { key: a, html: অনুচ্ছেদ ২ }
                      - { key: b, html: অনুচ্ছেদ ২ক }
                      - { key: c, html: অনুচ্ছেদ ৩ }
                      - { key: d, html: অনুচ্ছেদ ৪ক }
                    correct_option: b
                    explanation: '<p>সংবিধানের ২ক অনুচ্ছেদে বলা হয়েছে, প্রজাতন্ত্রের রাষ্ট্রধর্ম ইসলাম, তবে অন্যান্য ধর্ম পালনে রাষ্ট্র সমমর্যাদা ও সমঅধিকার নিশ্চিত করবে।</p>'
                    answer_locked: false
                    difficulty: 2
                    source_label: ৪৫তম বিসিএস
                    topic:
                      id: '1203'
                      parent_id: '120'
                      type: topic
                      name_bn: সংবিধান
                      name_en: Constitution
                      slug: constitution
                      icon: null
                      question_count: 640
                      has_children: false
                      progress: null
                    is_bookmarked: true
                    stats: { correct_pct: 61.5 }
                  - id: '30002'
                    body: '<p>যদি <span class="math" data-latex="x^2 = 49">x^2 = 49</span> হয় এবং x ধনাত্মক হয়, তবে x এর মান কত?</p>'
                    options:
                      - { key: a, html: '৫' }
                      - { key: b, html: '৬' }
                      - { key: c, html: '৭' }
                      - { key: d, html: '৮' }
                    correct_option: c
                    explanation: '<p><span class="math" data-latex="x = \sqrt{49} = 7">x = √49 = 7</span></p>'
                    answer_locked: false
                    difficulty: 1
                    source_label: সোনালী ব্যাংক এসও ২০২২
                    topic:
                      id: '1305'
                      parent_id: '130'
                      type: topic
                      name_bn: বীজগণিত
                      name_en: Algebra
                      slug: algebra
                      icon: null
                      question_count: 820
                      has_children: false
                      progress: null
                    is_bookmarked: false
                    stats: { correct_pct: 78 }
                meta:
                  next_cursor: null
                  has_more: false

  /bookmarks/{id}:
    put:
      tags: [Questions]
      summary: Bookmark question {id}
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Bookmarked }
    delete:
      tags: [Questions]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Removed }

  /wrong-questions:
    get:
      tags: [Questions]
      summary: Revision list of wrongly answered questions (FR-PRAC-05)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Question' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
              example:
                data:
                  - id: '30002'
                    body: '<p>যদি <span class="math" data-latex="x^2 = 49">x^2 = 49</span> হয় এবং x ধনাত্মক হয়, তবে x এর মান কত?</p>'
                    options:
                      - { key: a, html: '৫' }
                      - { key: b, html: '৬' }
                      - { key: c, html: '৭' }
                      - { key: d, html: '৮' }
                    correct_option: c
                    explanation: '<p><span class="math" data-latex="x = \sqrt{49} = 7">x = √49 = 7</span></p>'
                    answer_locked: false
                    difficulty: 1
                    source_label: সোনালী ব্যাংক এসও ২০২২
                    topic:
                      id: '1305'
                      parent_id: '130'
                      type: topic
                      name_bn: বীজগণিত
                      name_en: Algebra
                      slug: algebra
                      icon: null
                      question_count: 820
                      has_children: false
                      progress: null
                    is_bookmarked: false
                    stats: { correct_pct: 78 }
                  - id: '30003'
                    body: '<p>"অপরাজেয় বাংলা" ভাস্কর্যের শিল্পী কে?</p>'
                    options:
                      - { key: a, html: হামিদুজ্জামান খান }
                      - { key: b, html: সৈয়দ আব্দুল্লাহ খালিদ }
                      - { key: c, html: নভেরা আহমেদ }
                      - { key: d, html: শামীম শিকদার }
                    correct_option: null
                    explanation: null
                    answer_locked: true
                    difficulty: 2
                    source_label: ৪৪তম বিসিএস
                    topic:
                      id: '1401'
                      parent_id: '140'
                      type: topic
                      name_bn: বাংলাদেশের সংস্কৃতি
                      name_en: Culture of Bangladesh
                      slug: culture-of-bangladesh
                      icon: null
                      question_count: 410
                      has_children: false
                      progress: null
                    is_bookmarked: false
                    stats: { correct_pct: 44 }
                meta:
                  next_cursor: null
                  has_more: false

  # ------------------------------------------------------------------ Search
  /search/questions:
    get:
      tags: [Search]
      summary: Smart search (FR-SRCH-01)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - name: category_id
          in: query
          schema: { type: string }
        - name: node_id
          in: query
          schema: { type: string }
        - name: year
          in: query
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SearchHit' }
                  meta:
                    type: object
                    properties:
