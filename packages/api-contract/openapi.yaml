                  source: { type: string, enum: [payment, trial, manual] }
                  starts_at: { type: string, format: date-time }
                  ends_at: { type: string, format: date-time }
                  note: { type: [string, 'null'] }
            payments:
              type: array
              items: { $ref: '#/components/schemas/Payment' }
            recent_attempts:
              type: array
              items: { $ref: '#/components/schemas/AttemptSummary' }

    ImportJob:
      type: object
      properties:
        id: { type: string }
        file_name: { type: string }
        status: { type: string, enum: [uploaded, validating, validated, importing, done, failed] }
        columns:
          type: array
          items: { type: string }
        preview_rows:
          type: array
          items: { type: object, additionalProperties: true }
        total_rows: { type: integer }
        valid_rows: { type: integer }
        imported_rows: { type: integer }
        duplicate_rows: { type: integer }
        failed_rows: { type: integer }
        row_errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              field: { type: string }
              message: { type: string }
        error_file_url: { type: [string, 'null'] }
