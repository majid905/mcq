                  data:
                    type: object
                    additionalProperties: true
    patch:
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': { description: Saved }
# Packages, coupons, banners, admins and roles CRUD follow the same REST pattern:
# /admin/packages, /admin/coupons, /admin/banners, /admin/admins, /admin/roles
# (GET list, POST create, PUT /{id}, DELETE /{id}). Add them to this file in Phase 4
# before implementing.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]+$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AuthSession:
      description: Tokens + user
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/AuthSession' }

  schemas:
    Phone:
      type: string
      pattern: '^01[3-9][0-9]{8}$'
      example: '01712345678'
    OptionKey:
      type: string
      enum: [a, b, c, d, e]
    QuestionStatus:
      type: string
      enum: [draft, in_review, published, archived]
    AttemptKind:
      type: string
      enum: [live, live_practice, model, previous_year, custom, quick_practice]
    Locale:
      type: string
      enum: [bn, en]

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: EXAM_NOT_STARTED }
            message: { type: string }
            details: { type: object, additionalProperties: true }
      example:
        error:
          code: EXAM_NOT_STARTED
          message: পরীক্ষা এখনো শুরু হয়নি
          details:
            starts_at: '2026-11-01T14:00:00.000Z'
    CursorMeta:
      type: object
      properties:
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }

    HealthStatus:
      type: object
      required: [status, checks, server_time]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          required: [database, redis]
          properties:
            database: { type: string, enum: [up, down] }
            redis: { type: string, enum: [up, down] }
        server_time: { type: string, format: date-time }
      example:
        status: ok
        checks: { database: up, redis: up }
        server_time: '2026-10-24T05:30:00.000Z'

    DeviceInfo:
      type: object
