openapi: 3.1.0
info:
  title: MCQ Exam Platform API
  version: 1.0.0
  description: |
    Single source of truth for the API used by the Flutter app, the Next.js web app
    and the Next.js admin panel. Every response is wrapped in an envelope
    `{ data, meta }`; errors are `{ error: { code, message, details } }`.
    IDs are strings. Times are ISO-8601 UTC. Student endpoints use Bearer JWT
    (mobile) or httpOnly cookie (web). Admin endpoints live under /v1/admin.
servers:
  - url: https://api.example.com/v1
    description: production
  - url: http://localhost:3000/v1
    description: local API
  - url: http://localhost:4010/v1
    description: Prism mock (pnpm mock)

tags:
  - name: Auth
  - name: Me
  - name: Settings
  - name: Taxonomy
  - name: Questions
  - name: Search
  - name: Exams
  - name: Attempts
  - name: Practice
  - name: Analytics
  - name: Billing
  - name: Notifications
  - name: Admin
  - name: System

security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------ Auth
  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Send OTP to phone (register or reset)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, purpose]
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
                purpose: { type: string, enum: [register, reset_password] }
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      resend_after_sec: { type: integer, example: 60 }
                      expires_in_sec: { type: integer, example: 300 }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP, returns a short-lived verification token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, purpose]
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
                code: { type: string, pattern: '^[0-9]{6}$', example: '123456', description: 'Mock and dev OTP is 123456' }
                purpose: { type: string, enum: [register, reset_password] }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verification_token: { type: string, example: vt_3f9a1c7e5b2d4a60 }
        '400': { $ref: '#/components/responses/Error' }

  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Complete registration after OTP verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_token, name, password, device]
              properties:
                verification_token: { type: string }
                name: { type: string, minLength: 2, maxLength: 100 }
                password: { type: string, minLength: 8, maxLength: 64 }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '201': { $ref: '#/components/responses/AuthSession' }
        '400': { $ref: '#/components/responses/Error' }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login with phone and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password, device]
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
                password: { type: string }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current session
      responses:
        '204': { description: Logged out }

  /auth/password/reset:
    post:
      tags: [Auth]
      security: []
      summary: Set new password after OTP (purpose reset_password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_token, password]
              properties:
                verification_token: { type: string }
                password: { type: string, minLength: 8, maxLength: 64 }
      responses:
        '204': { description: 'Password changed; all sessions revoked' }
        '400': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ Me
  /me:
    get:
      tags: [Me]
      summary: Current user profile with subscription summary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Me' }
    patch:
      tags: [Me]
      summary: Update profile and preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Me' }
    delete:
      tags: [Me]
      summary: Request account deletion (FR-AUTH-10)
      responses:
        '202': { description: Deletion scheduled }

  /me/devices/reset:
    post:
      tags: [Me]
      summary: Self device reset (FR-AUTH-07)
      responses:
        '204': { description: Other device signed out }
        '429': { $ref: '#/components/responses/Error' }

  /me/push-token:
    put:
      tags: [Notifications]
      summary: Register FCM token for this device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: Saved }

  /me/attempts:
    get:
      tags: [Attempts]
      summary: Attempt history (cursor)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/AttemptKind' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AttemptSummary' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }

  # ------------------------------------------------------------------ Settings
  /settings/public:
    get:
      tags: [Settings]
      security: []
      summary: Public app settings (min version, maintenance, free limits)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PublicSettings' }

  /home:
    get:
      tags: [Settings]
      summary: Home feed in one call (FR-HOME-01..03)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/HomeFeed' }

  # ------------------------------------------------------------------ System
  /health:
    get:
      tags: [System]
      security: []
      summary: Liveness and dependency check (MySQL, Redis). 503 when a dependency is down.
      responses:
        '200':
          description: All dependencies up
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: A dependency is down (same body shape, status degraded)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/HealthStatus' }

  # ------------------------------------------------------------------ Taxonomy
  /taxonomy:
    get:
      tags: [Taxonomy]
      security: []
      summary: Children of a node (root categories when parent_id omitted)
      parameters:
        - name: parent_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TaxonomyNode' }
              example:
                data:
                  - id: '1'
                    parent_id: null
                    type: category
                    name_bn: বিসিএস
                    name_en: BCS
                    slug: bcs
                    icon: graduation-cap
                    question_count: 52340
                    has_children: true
                    progress: null
                  - id: '2'
                    parent_id: null
                    type: category
                    name_bn: ব্যাংক
                    name_en: Bank
                    slug: bank
                    icon: landmark
                    question_count: 31820
                    has_children: true
                    progress: null
                  - id: '3'
                    parent_id: null
                    type: category
                    name_bn: প্রাইমারি
                    name_en: Primary
                    slug: primary
                    icon: school
                    question_count: 18450
                    has_children: true
                    progress: null
                  - id: '4'
                    parent_id: null
                    type: category
                    name_bn: এনটিআরসিএ
                    name_en: NTRCA
                    slug: ntrca
                    icon: book-open
                    question_count: 22190
                    has_children: true
                    progress: null
                  - id: '5'
                    parent_id: null
                    type: category
                    name_bn: ভর্তি পরীক্ষা
                    name_en: Admission
                    slug: admission
                    icon: pencil
                    question_count: 27610
                    has_children: true
                    progress: null

  /source-exams:
    get:
      tags: [Taxonomy]
      security: []
      summary: Previous-year source exams (FR-PRAC-04)
      parameters:
        - name: category_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SourceExam' }
              example:
                data:
                  - { id: '801', name_bn: ৪৫তম বিসিএস প্রিলিমিনারি, name_en: 45th BCS Preliminary, slug: 45th-bcs-preliminary, year: 2023, question_count: 200, paper_exam_id: '5101' }
                  - { id: '802', name_bn: ৪৪তম বিসিএস প্রিলিমিনারি, name_en: 44th BCS Preliminary, slug: 44th-bcs-preliminary, year: 2022, question_count: 200, paper_exam_id: '5102' }
                  - { id: '803', name_bn: ৪৩তম বিসিএস প্রিলিমিনারি, name_en: 43rd BCS Preliminary, slug: 43rd-bcs-preliminary, year: 2021, question_count: 200, paper_exam_id: null }

  # ------------------------------------------------------------------ Questions
  /questions/{id}:
    get:
      tags: [Questions]
      summary: Single question; answer included only if allowed for this user
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Question' }
