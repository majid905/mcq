openapi: 3.1.0
info:
  title: MCQ Exam Platform API
  version: 1.0.0
  description: |
    Single source of truth for the API used by the Flutter app, the Next.js web app
    and the Next.js admin panel. Every response is wrapped in an envelope
    `{ data, meta }`; errors are `{ error: { code, message, details } }`.
    IDs are strings. Times are ISO-8601 UTC. Student endpoints use Bearer JWT
    (mobile) or httpOnly cookie (web). Admin endpoints live under /v1/admin.
servers:
  - url: https://api.example.com/v1
    description: production
  - url: http://localhost:3000/v1
    description: local API
  - url: http://localhost:4010/v1
    description: Prism mock (pnpm mock)

tags:
  - name: Auth
  - name: Me
  - name: Settings
  - name: Taxonomy
  - name: Questions
  - name: Search
  - name: Exams
  - name: Attempts
  - name: Practice
  - name: Analytics
  - name: Billing
  - name: Notifications
  - name: Admin
  - name: System

security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------ Auth
  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Send OTP to phone (register or reset)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, purpose]
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
                purpose: { type: string, enum: [register, reset_password] }
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      resend_after_sec: { type: integer, example: 60 }
                      expires_in_sec: { type: integer, example: 300 }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP, returns a short-lived verification token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, purpose]
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
                code: { type: string, pattern: '^[0-9]{6}$', example: '123456', description: 'Mock and dev OTP is 123456' }
                purpose: { type: string, enum: [register, reset_password] }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verification_token: { type: string, example: vt_3f9a1c7e5b2d4a60 }
        '400': { $ref: '#/components/responses/Error' }

  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Complete registration after OTP verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_token, name, password, device]
              properties:
                verification_token: { type: string }
                name: { type: string, minLength: 2, maxLength: 100 }
                password: { type: string, minLength: 8, maxLength: 64 }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '201': { $ref: '#/components/responses/AuthSession' }
        '400': { $ref: '#/components/responses/Error' }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login with phone and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password, device]
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
                password: { type: string }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current session
      responses:
        '204': { description: Logged out }

  /auth/password/reset:
    post:
      tags: [Auth]
      security: []
      summary: Set new password after OTP (purpose reset_password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_token, password]
              properties:
                verification_token: { type: string }
                password: { type: string, minLength: 8, maxLength: 64 }
      responses:
        '204': { description: 'Password changed; all sessions revoked' }
        '400': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ Me
  /me:
    get:
      tags: [Me]
      summary: Current user profile with subscription summary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Me' }
    patch:
      tags: [Me]
      summary: Update profile and preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Me' }
    delete:
      tags: [Me]
      summary: Request account deletion (FR-AUTH-10)
      responses:
        '202': { description: Deletion scheduled }

  /me/devices/reset:
    post:
      tags: [Me]
      summary: Self device reset (FR-AUTH-07)
      responses:
        '204': { description: Other device signed out }
        '429': { $ref: '#/components/responses/Error' }

  /me/push-token:
    put:
      tags: [Notifications]
      summary: Register FCM token for this device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: Saved }

  /me/attempts:
    get:
      tags: [Attempts]
      summary: Attempt history (cursor)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/AttemptKind' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AttemptSummary' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }

  # ------------------------------------------------------------------ Settings
  /settings/public:
    get:
      tags: [Settings]
      security: []
      summary: Public app settings (min version, maintenance, free limits)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PublicSettings' }

  /home:
    get:
      tags: [Settings]
      summary: Home feed in one call (FR-HOME-01..03)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/HomeFeed' }

  # ------------------------------------------------------------------ System
  /health:
    get:
      tags: [System]
      security: []
      summary: Liveness and dependency check (MySQL, Redis). 503 when a dependency is down.
      responses:
        '200':
          description: All dependencies up
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: A dependency is down (same body shape, status degraded)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/HealthStatus' }

  # ------------------------------------------------------------------ Taxonomy
  /taxonomy:
    get:
      tags: [Taxonomy]
      security: []
      summary: Children of a node (root categories when parent_id omitted)
      parameters:
        - name: parent_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TaxonomyNode' }
              example:
                data:
                  - id: '1'
                    parent_id: null
                    type: category
                    name_bn: বিসিএস
                    name_en: BCS
                    slug: bcs
                    icon: graduation-cap
                    question_count: 52340
                    has_children: true
                    progress: null
                  - id: '2'
                    parent_id: null
                    type: category
                    name_bn: ব্যাংক
                    name_en: Bank
                    slug: bank
                    icon: landmark
                    question_count: 31820
                    has_children: true
                    progress: null
                  - id: '3'
                    parent_id: null
                    type: category
                    name_bn: প্রাইমারি
                    name_en: Primary
                    slug: primary
                    icon: school
                    question_count: 18450
                    has_children: true
                    progress: null
                  - id: '4'
                    parent_id: null
                    type: category
                    name_bn: এনটিআরসিএ
                    name_en: NTRCA
                    slug: ntrca
                    icon: book-open
                    question_count: 22190
                    has_children: true
                    progress: null
                  - id: '5'
                    parent_id: null
                    type: category
                    name_bn: ভর্তি পরীক্ষা
                    name_en: Admission
                    slug: admission
                    icon: pencil
                    question_count: 27610
                    has_children: true
                    progress: null

  /source-exams:
    get:
      tags: [Taxonomy]
      security: []
      summary: Previous-year source exams (FR-PRAC-04)
      parameters:
        - name: category_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SourceExam' }

  # ------------------------------------------------------------------ Questions
  /questions/{id}:
    get:
      tags: [Questions]
      summary: Single question; answer included only if allowed for this user
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Question' }
        '404': { $ref: '#/components/responses/Error' }

  /public/questions/{slug}:
    get:
      tags: [Questions]
      security: []
      summary: Public SEO question page data (FR-WEB-02)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Question' }

  /questions/{id}/reports:
    post:
      tags: [Questions]
      summary: Report a question (FR-REP-01)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [wrong_answer, typo, wrong_explanation, duplicate, other] }
                message: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Reported }
        '409': { $ref: '#/components/responses/Error' }

  /bookmarks:
    get:
      tags: [Questions]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Question' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }

  /bookmarks/{id}:
    put:
      tags: [Questions]
      summary: Bookmark question {id}
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Bookmarked }
    delete:
      tags: [Questions]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Removed }

  /wrong-questions:
    get:
      tags: [Questions]
      summary: Revision list of wrongly answered questions (FR-PRAC-05)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Question' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }

  # ------------------------------------------------------------------ Search
  /search/questions:
    get:
      tags: [Search]
      summary: Smart search (FR-SRCH-01)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - name: category_id
          in: query
          schema: { type: string }
        - name: node_id
          in: query
          schema: { type: string }
        - name: year
          in: query
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SearchHit' }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      took_ms: { type: integer }

  # ------------------------------------------------------------------ Exams
  /exams:
    get:
      tags: [Exams]
      summary: List exams (FR-EXAM-01)
      parameters:
        - name: status
          in: query
          required: true
          schema: { type: string, enum: [upcoming, running, finished] }
        - name: type
          in: query
          schema: { type: string, enum: [live, model, previous_year] }
        - name: category_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExamCard' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
              example:
                data:
                  - id: '5002'
                    type: live
                    title: ব্যাংক জব লাইভ পরীক্ষা - ০৫
                    category: ব্যাংক
                    start_at: '2026-10-24T04:00:00.000Z'
                    end_at: '2026-10-24T08:00:00.000Z'
                    duration_sec: 1800
                    question_count: 50
                    total_marks: 50
                    participant_count: 3412
                    is_premium: false
                    status: running
                    my_attempt: null
                    has_reminder: false
                  - id: '5003'
                    type: live
                    title: ৪৭তম বিসিএস লাইভ মডেল টেস্ট - ১২
                    category: বিসিএস
                    start_at: '2026-10-25T14:00:00.000Z'
                    end_at: '2026-10-25T16:00:00.000Z'
                    duration_sec: 3600
                    question_count: 100
                    total_marks: 100
                    participant_count: 0
                    is_premium: false
                    status: upcoming
                    my_attempt: null
                    has_reminder: true
                  - id: '5004'
                    type: model
                    title: প্রাথমিক শিক্ষক নিয়োগ মডেল টেস্ট - ০৩
                    category: প্রাইমারি
                    start_at: null
                    end_at: null
                    duration_sec: 2400
                    question_count: 60
                    total_marks: 60
                    participant_count: 8120
                    is_premium: true
                    status: finished
                    my_attempt:
                      attempt_id: '90011'
                      status: scored
                      score: 42.5
                    has_reminder: false
                meta:
                  next_cursor: '5004'
                  has_more: true

  /exams/{id}:
    get:
      tags: [Exams]
      summary: Exam detail (FR-EXAM-02)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ExamDetail' }
              example:
                data: &exam_detail_example
                  id: '5003'
                  type: live
                  title: ৪৭তম বিসিএস লাইভ মডেল টেস্ট - ১২
                  category: বিসিএস
                  start_at: '2026-10-25T14:00:00.000Z'
                  end_at: '2026-10-25T16:00:00.000Z'
                  duration_sec: 3600
                  question_count: 100
                  total_marks: 100
                  participant_count: 0
                  is_premium: false
                  status: upcoming
                  my_attempt: null
                  has_reminder: true
                  description: বাংলা, ইংরেজি, গণিত, সাধারণ জ্ঞান ও বিজ্ঞান থেকে ১০০টি প্রশ্ন।
                  mark_per_question: 1
                  negative_mark: 0.5
                  pass_marks: 40
                  result_publish_at: '2026-10-25T18:00:00.000Z'
                  syllabus:
                    - node_id: '11'
                      label: বাংলা ভাষা ও সাহিত্য
                      questions: 25
                      marks: 25
                    - node_id: '12'
                      label: ইংরেজি ভাষা ও সাহিত্য
                      questions: 25
                      marks: 25
                    - node_id: '13'
                      label: গাণিতিক যুক্তি
                      questions: 20
                      marks: 20
                    - node_id: '14'
                      label: সাধারণ জ্ঞান
                      questions: 30
                      marks: 30
                  rules:
                    - প্রতিটি প্রশ্নের মান ১। ভুল উত্তরের জন্য ০.৫ নম্বর কাটা যাবে।
                    - পরীক্ষা শুরুর পর অ্যাপ বা ট্যাব পরিবর্তন করা যাবে না।
                    - সময় শেষ হলে উত্তর স্বয়ংক্রিয়ভাবে জমা হবে।
                  locked_reason: null

  /exams/{id}/reminder:
    put:
      tags: [Exams]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Reminder set }
    delete:
      tags: [Exams]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Reminder removed }

  /exams/{id}/start:
    post:
      tags: [Attempts]
      summary: Start (or resume) an attempt (FR-EXAM-04, 05, 09)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [ranked, practice]
                  default: ranked
                  description: practice = take a finished live exam unranked (FR-EXAM-11)
      responses:
        '201':
          description: Attempt started or resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AttemptStart' }
        '402': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '425': { $ref: '#/components/responses/Error' }

  /exams/{id}/paper:
    get:
      tags: [Exams]
      summary: Paper JSON (no answers). Clients normally fetch paper_url from CDN; this is the fallback.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Paper' }

  /exams/{id}/leaderboard:
    get:
      tags: [Exams]
      summary: Top 100 + my row (FR-RES-06)
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: scope
          in: query
          schema: { type: string, enum: [overall, district], default: overall }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      is_final: { type: boolean }
                      participants: { type: integer }
                      top:
                        type: array
                        items: { $ref: '#/components/schemas/LeaderboardRow' }
                      me: { $ref: '#/components/schemas/LeaderboardRow' }

  # ------------------------------------------------------------------ Attempts
  /attempts/{id}/answers:
    put:
      tags: [Attempts]
      summary: Periodic answer sync (FR-EXAM-07). Full current answer map, idempotent.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerSync' }
      responses:
        '200':
          description: Synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      saved_count: { type: integer }
                      server_time: { type: string, format: date-time }
        '410': { $ref: '#/components/responses/Error' }

  /attempts/{id}/submit:
    post:
      tags: [Attempts]
      summary: Final submit (FR-EXAM-08). Returns 202 immediately; scoring is async.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerSync' }
      responses:
        '202':
          description: Received
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [received] }
                      result_eta_sec: { type: integer, example: 10 }
        '410': { $ref: '#/components/responses/Error' }

  /attempts/{id}/result:
    get:
      tags: [Attempts]
      summary: Result; 202 while scoring (poll every 3 s, max 60 s)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Scored
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AttemptResult' }
        '202': { description: Still scoring }

  /attempts/{id}/solutions:
    get:
      tags: [Attempts]
      summary: Solution review (FR-RES-05); for live exams only after end_at
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: filter
          in: query
          schema: { type: string, enum: [all, wrong, skipped, correct], default: all }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SolutionItem' }
        '403': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ Practice
  /practice/sessions:
    post:
