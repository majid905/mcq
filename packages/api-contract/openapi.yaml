      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AttemptStart' }
        '402': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /practice/sessions/{id}/answer:
    post:
      tags: [Practice]
      summary: Answer one question in quick practice; returns correctness + explanation
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id, option]
              properties:
