components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]+$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AdminSession:
      description: Admin tokens + profile
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/AdminSession' }

    AuthSession:
      description: Tokens + user
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/AuthSession' }

  schemas:
    AdminProfile:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string }
        permissions:
          type: array
          items: { type: string }
        totp_enabled: { type: boolean }

    AdminSession:
      type: object
      properties:
        access_token: { type: string }
        access_expires_in: { type: integer, example: 900 }
        refresh_token: { type: string }
        admin: { $ref: '#/components/schemas/AdminProfile' }

    Phone:
      type: string
      pattern: '^01[3-9][0-9]{8}$'
      example: '01712345678'
    OptionKey:
      type: string
      enum: [a, b, c, d, e]
    QuestionStatus:
      type: string
      enum: [draft, in_review, published, archived]
    AttemptKind:
      type: string
      enum: [live, live_practice, model, previous_year, custom, quick_practice]
    Locale:
      type: string
      enum: [bn, en]

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: EXAM_NOT_STARTED }
            message: { type: string }
            details: { type: object, additionalProperties: true }
      example:
        error:
          code: EXAM_NOT_STARTED
          message: পরীক্ষা এখনো শুরু হয়নি
          details:
            starts_at: '2026-11-01T14:00:00.000Z'
    CursorMeta:
      type: object
      properties:
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }

    HealthStatus:
      type: object
      required: [status, checks, server_time]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          required: [database, redis]
          properties:
            database: { type: string, enum: [up, down] }
            redis: { type: string, enum: [up, down] }
        server_time: { type: string, format: date-time }
      example:
        status: ok
        checks: { database: up, redis: up }
        server_time: '2026-10-24T05:30:00.000Z'

    DeviceInfo:
      type: object
      required: [device_id, platform]
      properties:
        device_id: { type: string, maxLength: 128 }
        platform: { type: string, enum: [android, ios, web] }
        model: { type: string }
        app_version: { type: string }

    AuthSession:
      type: object
      properties:
        access_token: { type: string }
        access_expires_in: { type: integer, example: 900 }
        refresh_token: { type: string, description: Mobile only; web gets httpOnly cookie }
        user: { $ref: '#/components/schemas/Me' }
      example:
        access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMDAxIiwiZGV2IjoiNTAxIiwicHJlbSI6ZmFsc2V9.mock-signature
        access_expires_in: 900
        refresh_token: mock-refresh-token-7c1f0d2e9a
        user:
          id: '1001'
          phone: '01712345678'
          name: মোঃ রাকিব হাসান
          avatar_url: null
          district_id: 1
          target_node_ids: ['1', '2']
          locale: bn
          theme: system
          onboarding_done: true
          subscription:
            is_premium: false
            source: null
            ends_at: null
            category_ids: null
            trial_available: true
          quotas:
            practice_left_today: 7
            live_exams_left_month: 2
            search_answers_left_today: 3

    SubscriptionSummary:
      type: object
      properties:
        is_premium: { type: boolean }
        source: { type: [string, 'null'], enum: [payment, trial, manual, null] }
        ends_at: { type: [string, 'null'], format: date-time }
        category_ids:
          type: [array, 'null']
          items: { type: string }
        trial_available: { type: boolean }

    Me:
      type: object
      properties:
        id: { type: string }
        phone: { $ref: '#/components/schemas/Phone' }
        name: { type: string }
        avatar_url: { type: [string, 'null'] }
        district_id: { type: [integer, 'null'] }
        target_node_ids:
          type: array
          items: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        theme: { type: string, enum: [system, light, dark] }
        onboarding_done: { type: boolean }
        subscription: { $ref: '#/components/schemas/SubscriptionSummary' }
        quotas:
          type: object
          properties:
            practice_left_today: { type: [integer, 'null'] }
            live_exams_left_month: { type: [integer, 'null'] }
            search_answers_left_today: { type: [integer, 'null'] }
      example:
        id: '1001'
        phone: '01712345678'
        name: মোঃ রাকিব হাসান
        avatar_url: null
        district_id: 1
        target_node_ids: ['1', '2']
        locale: bn
        theme: system
        onboarding_done: true
        subscription:
          is_premium: false
          source: null
          ends_at: null
          category_ids: null
          trial_available: true
        quotas:
          practice_left_today: 7
          live_exams_left_month: 2
          search_answers_left_today: 3

    MeUpdate:
      type: object
      properties:
        name: { type: string }
        avatar_url: { type: string }
        district_id: { type: integer, minimum: 1, maximum: 64 }
        target_node_ids:
          type: array
          items: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        theme: { type: string, enum: [system, light, dark] }

    PublicSettings:
      type: object
      properties:
        server_time: { type: string, format: date-time }
        min_supported_version:
          type: object
          properties:
            android: { type: string }
            ios: { type: string }
        maintenance:
          type: object
          properties:
            enabled: { type: boolean }
            message_bn: { type: string }
            message_en: { type: string }
        free_live_exams_per_month: { type: integer }
        free_practice_per_day: { type: integer }
        trial_days: { type: integer }
        support_phone: { type: string }
      example:
        server_time: '2026-10-24T05:30:00.000Z'
        min_supported_version:
          android: 1.0.0
          ios: 1.0.0
        maintenance:
          enabled: false
          message_bn: সার্ভার রক্ষণাবেক্ষণের কাজ চলছে। কিছুক্ষণ পর আবার চেষ্টা করুন।
          message_en: We are under maintenance. Please try again shortly.
        free_live_exams_per_month: 2
        free_practice_per_day: 10
        trial_days: 3
        support_phone: '01800000000'

    Banner:
      type: object
      properties:
        id: { type: string }
        image_url: { type: string }
        deep_link: { type: [string, 'null'] }
        title: { type: string }

    HomeFeed:
      type: object
      properties:
