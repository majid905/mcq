# /etc/nginx/sites-available/mcq-admin.ellevix.com
# Needs a Cloudflare DNS record first: mcq-admin  A  4.193.116.31  (proxied).
# Then: sudo certbot --nginx -d mcq-admin.ellevix.com --redirect
map $http_cf_connecting_ip $mcq_admin_client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcq-admin.ellevix.com;

    client_max_body_size 8m;

    # Admin panel (apps/admin, mcq-admin.service); it talks to https://mcq.ellevix.com/v1
    location / {
        proxy_pass http://127.0.0.1:3052;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $mcq_admin_client_ip;
        proxy_set_header X-Forwarded-For $mcq_admin_client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}
