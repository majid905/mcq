# /etc/nginx/sites-available/mcq.ellevix.com (certbot adds the 443 block).
# Cloudflare proxies this host; CF-Connecting-IP carries the visitor's real address.
map $http_cf_connecting_ip $mcq_client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcq.ellevix.com;

    client_max_body_size 2m;

    # API, Swagger UI and the contract
    location ~ ^/(v1|docs|openapi\.json) {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $mcq_client_ip;
        proxy_set_header X-Forwarded-For $mcq_client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # Student web (apps/web, mcq-web.service)
    location / {
        proxy_pass http://127.0.0.1:3051;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $mcq_client_ip;
        proxy_set_header X-Forwarded-For $mcq_client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}
