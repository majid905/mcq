# Isolated MySQL 8.4 + Redis 7 for mcq.ellevix.com. The server hosts other sites, so both
# services listen on loopback only and on non-default ports (3307 / 6380).
#   cd /srv/mcq/app && docker compose --env-file /srv/mcq/.env -f deploy/docker-compose.prod.yml up -d
name: mcq-prod

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - '127.0.0.1:3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in /srv/mcq/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mcq}
      MYSQL_USER: ${MYSQL_USER:-mcq}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in /srv/mcq/.env}
      TZ: UTC
    # docs/03-DATABASE.md section 5, scaled down: this box is shared and has 8 GB of RAM.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --innodb-buffer-pool-size=384M
      - --innodb-redo-log-capacity=256M
      - --innodb-flush-log-at-trx-commit=1
      - --max-connections=100
      - --performance-schema=OFF
      - --skip-log-bin
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 900m
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF on: the submit stream must survive a restart (docs/02 "Redis queue durability").
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis-data:/data
    mem_limit: 320m
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
  redis-data:
