name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: change-me-root
          MYSQL_DATABASE: mcq
          MYSQL_USER: mcq
          MYSQL_PASSWORD: change-me
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pchange-me-root --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: ci-meili-master-key
          MEILI_NO_ANALYTICS: 'true'
        ports: ['7700:7700']
        options: >-
          --health-cmd="curl -fs http://localhost:7700/health || exit 1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_ROOT_PASSWORD: change-me-root
      DATABASE_URL: mysql://mcq:change-me@127.0.0.1:3306/mcq
      REDIS_URL: redis://127.0.0.1:6379
      MEILI_URL: http://127.0.0.1:7700
      MEILI_MASTER_KEY: ci-meili-master-key
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789
      SMS_DRIVER: console
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Applies database/schema.sql, runs prisma db pull + generate, seeds.
      - name: Reset and seed database
        run: pnpm db:reset
      - name: Prisma schema drift check (schema.sql vs committed schema.prisma)
        run: git diff --exit-code -- apps/api/prisma/schema.prisma
      - name: Contract drift check (openapi.yaml vs committed generated client)
        run: |
          pnpm contract:gen
          git diff --exit-code -- packages/api-client-ts

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Contract tests (real responses vs openapi.yaml)
        run: pnpm test:contract -- --reporters=default --json --outputFile=jest-contract.json
      - name: Annotate failed contract tests
        if: failure()
        run: node scripts/ci-annotate-jest.mjs apps/api/jest-contract.json
      # Reports known-vulnerable production dependencies. Not blocking yet: a few findings sit in
      # apps/admin (Next.js' postcss) and prisma's CLI, see docs/SECURITY-REVIEW.md.
      - name: Dependency audit (high and critical)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high
